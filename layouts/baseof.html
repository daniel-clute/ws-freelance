<!DOCTYPE html>
<html lang="{{ site.Language.LanguageCode }}" dir="{{ or site.Language.LanguageDirection `ltr` }}">
<head>
  {{ partial "head.html" . }}
</head>
<body>
  {{ $minimal := eq .Type "shop" }}
  <header class="site-header">
    {{ partial "header.html" . }}
  </header>
  <main>
    {{ if $minimal }}
      <div class="site-shell-wide">
      {{ block "main" . }}{{ end }}
      </div>
    {{ else }}
      <div class="site-shell">
      {{ block "main" . }}{{ end }}
      </div>
    {{ end }}
  </main>
  {{ if not $minimal }}
    <footer class="site-footer">
      <p>Daniel Clute Software &amp; Design</p>
    </footer>
  {{ end }}
</body>
</html>
